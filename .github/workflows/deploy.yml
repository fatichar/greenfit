name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 22
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/greenfit' }}
  PM2_APP_NAME: ${{ vars.PM2_APP_NAME || 'greenfit' }}
  APP_PORT: ${{ vars.APP_PORT || '3000' }}
  APP_HOSTNAME: ${{ vars.APP_HOSTNAME || '127.0.0.1' }}
  VPS_PORT: ${{ vars.VPS_PORT || '22' }}
  REPO_URL: ${{ vars.REPO_URL || format('{0}/{1}.git', github.server_url, github.repository) }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Prod
    concurrency:
      group: greenfit-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG: ${{ vars.NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG }}
          GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

      - name: Package standalone app
        run: |
          mkdir -p .next/standalone/.next
          cp -a public .next/standalone/public
          cp -a .next/static .next/standalone/.next/static
          tar -czf greenfit-release.tar.gz -C .next/standalone .

      - name: Configure SSH
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host greenfit-vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            BatchMode yes
            ConnectTimeout 20
            ServerAliveInterval 30
            ServerAliveCountMax 4
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

          echo "Runner public IP:"
          curl -fsS https://api.ipify.org || true
          echo
          echo "Target: ${VPS_USER}@${VPS_HOST}:${VPS_PORT}"
          echo "DNS resolution:"
          getent hosts "$VPS_HOST" || true

          tcp_probe() {
            timeout 25s bash -c ": > /dev/tcp/${VPS_HOST}/${VPS_PORT}"
          }

          retry() {
            local attempt=1
            local max_attempts=8
            local delay=15

            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi

              echo "Attempt ${attempt} failed at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Retrying in ${delay}s..."
              sleep "$delay"
              attempt=$((attempt + 1))
              if [ "$delay" -lt 120 ]; then
                delay=$((delay * 2))
              fi
            done
          }

          retry tcp_probe
          retry ssh greenfit-vps "echo SSH connection ok"

      - name: Upload release
        run: scp -P "$VPS_PORT" greenfit-release.tar.gz greenfit-vps:"/tmp/greenfit-$GITHUB_SHA.tar.gz"

      - name: Activate release
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID }}
          NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG: ${{ vars.NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG }}
        run: |
          ssh greenfit-vps \
            "GITHUB_SHA='$GITHUB_SHA' DEPLOY_PATH='$DEPLOY_PATH' PM2_APP_NAME='$PM2_APP_NAME' APP_PORT='$APP_PORT' APP_HOSTNAME='$APP_HOSTNAME' NEXT_PUBLIC_UMAMI_SCRIPT_URL='$NEXT_PUBLIC_UMAMI_SCRIPT_URL' NEXT_PUBLIC_UMAMI_WEBSITE_ID='$NEXT_PUBLIC_UMAMI_WEBSITE_ID' NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG='$NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG' bash -s" <<'EOF'
          set -euo pipefail

          command -v pm2 >/dev/null 2>&1 || {
            echo "pm2 was not found on the VPS PATH. Install it with: npm install -g pm2"
            exit 1
          }

          RELEASE_DIR="$DEPLOY_PATH/releases/$GITHUB_SHA"
          ARCHIVE="/tmp/greenfit-$GITHUB_SHA.tar.gz"
          CURRENT="$DEPLOY_PATH/current"
          PREVIOUS_RELEASE=""
          if [ -L "$CURRENT" ]; then
            PREVIOUS_RELEASE="$(readlink -f "$CURRENT")"
          fi

          # A completed deployment may be rerun for the same commit.
          if [ "$PREVIOUS_RELEASE" = "$RELEASE_DIR" ]; then
            echo "This release is already active; skipping deployment and cleanup."
            rm -f -- "$ARCHIVE"
            exit 0
          fi

          mkdir -p "$DEPLOY_PATH/releases" "$RELEASE_DIR"
          tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
          rm -f -- "$ARCHIVE"
          test -f "$RELEASE_DIR/server.js"
          ln -sfn "$RELEASE_DIR" "$DEPLOY_PATH/current.next"
          mv -Tf "$DEPLOY_PATH/current.next" "$CURRENT"

          cat > "$DEPLOY_PATH/ecosystem.config.cjs" <<PM2_CONFIG
          module.exports = {
            apps: [
              {
                name: "$PM2_APP_NAME",
                cwd: "$DEPLOY_PATH/current",
                script: "server.js",
                env: {
                  NODE_ENV: "production",
                  PORT: "$APP_PORT",
                  HOSTNAME: "$APP_HOSTNAME",
                  NEXT_PUBLIC_UMAMI_SCRIPT_URL: "$NEXT_PUBLIC_UMAMI_SCRIPT_URL",
                  NEXT_PUBLIC_UMAMI_WEBSITE_ID: "$NEXT_PUBLIC_UMAMI_WEBSITE_ID",
                  NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG: "$NEXT_PUBLIC_AMAZON_ASSOCIATES_TAG"
                }
              }
            ]
          };
          PM2_CONFIG

          pm2 delete "$PM2_APP_NAME" >/dev/null 2>&1 || true
          pm2 start "$DEPLOY_PATH/ecosystem.config.cjs" --update-env
          pm2 save

          PM2_BIN="$(command -v pm2)"
          if command -v crontab >/dev/null 2>&1; then
            (crontab -l 2>/dev/null | grep -v 'pm2 resurrect' || true; echo "@reboot $PM2_BIN resurrect >/tmp/${PM2_APP_NAME}-pm2-resurrect.log 2>&1") | crontab -
          else
            echo "crontab was not found. For reboot persistence, run: pm2 startup && pm2 save"
          fi

          # Keep only the active release and its immediate predecessor.
          for candidate in "$DEPLOY_PATH"/releases/*; do
            [ -d "$candidate" ] || continue
            if [ "$candidate" != "$RELEASE_DIR" ] && [ "$candidate" != "$PREVIOUS_RELEASE" ]; then
              rm -rf -- "$candidate"
            fi
          done
          EOF
